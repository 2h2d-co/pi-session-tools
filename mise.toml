[settings]
lockfile = true
lockfile_mode = "generate"
lockfile_platforms = ["linux-x64", "macos-arm64"]
locked = true
minimum_release_age = "7d"

[tools]
node = "22.23.3"
npm = "11.20.0"
hk = { version = "2.2.0", postinstall = "hk install --mise" }
betterleaks = "1.8.1"
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.30.1"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.check]
description = "Run all non-writing validation"
run = ["npm run check", "npm test", "npm audit", "npm run pack:dry"]

[tasks.install]
description = "Install locked dependencies"
run = "npm ci --ignore-scripts"

[tasks.fmt]
description = "Format project files"
run = "npm run fmt"
