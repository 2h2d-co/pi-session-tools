[settings]
lockfile = true
lockfile_mode = "generate"
lockfile_platforms = ["linux-x64", "macos-arm64"]
locked = true
minimum_release_age = "7d"

[tools]
node = "22.23.3"
npm = "11.20.0"
hk = { version = "2.4.0", postinstall = "hk install --mise" }
betterleaks = "1.9.0"
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.30.1"

[tasks.check]
description = "Run all non-writing validation"
run = ["hk check --all --check", "npm test", "npm audit", "npm run pack:dry"]

[tasks.init]
description = "Install locked dependencies and Git hooks"
run = ["npm ci --ignore-scripts", "hk install --mise"]
