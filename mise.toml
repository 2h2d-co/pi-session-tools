[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]
locked = true
minimum_release_age = "7d"

[tools]
node = "22.23.2"
npm = "11.19.0"
hk = { version = "2.0.1", postinstall = "hk install --mise" }
betterleaks = "1.8.1"
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.29.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

# Bind in-process Pi resources to the tested dependency for test tasks only. A global
# PI_PACKAGE_DIR must not select another runtime's metadata; other Pi launches are unchanged.
[tasks.check]
description = "Run all non-writing validation"
env = { PI_PACKAGE_DIR = "{{config_root}}/node_modules/@earendil-works/pi-coding-agent" }
run = ["npm run check", "npm test", "npm audit", "npm run pack:dry"]

[tasks.test]
description = "Run behavioral tests"
env = { PI_PACKAGE_DIR = "{{config_root}}/node_modules/@earendil-works/pi-coding-agent" }
run = "npm test"

[tasks.install]
description = "Install locked dependencies"
run = "npm ci --ignore-scripts"

[tasks.fmt]
description = "Format project files"
run = "npm run fmt"

[tasks."test:live"]
description = "Verify packaged handoffs through Pi 0.87.0 and live Codex"
run = '''
export PI_PACKAGE_DIR="$PWD/node_modules/@earendil-works/pi-coding-agent"
PI_SESSION_TOOLS_LIVE_API_KEY="$(./node_modules/.bin/pi auth print-bearer-token --provider openai-codex --model gpt-5.6-luna)" \
  npm run test:live
'''
